<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Royal Choice | Доставка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg-color: #f8f9fa; 
            --card-bg: #ffffff; 
            --accent: #d4af37; 
            --accent-grad: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            --text-main: #212529; 
            --text-muted: #6c757d; 
            --border: #dee2e6; 
            --danger: #dc3545;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }
        
        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
        .sub-location { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        
        .category-nav { display: flex; gap: 10px; padding: 12px 16px; overflow-x: auto; background: var(--bg-color); border-bottom: 1px solid var(--border); scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .category-btn.active { background: var(--accent-grad); color: #fff; border-color: var(--accent); font-weight: 700; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3); }
        
        .container { padding: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card-img-wrap { position: relative; width: 100%; height: 140px; background: #e9ecef; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .weight-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.75); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; backdrop-filter: blur(4px); }
        
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
        .card-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; flex-grow: 1; line-height: 1.3; }
        .allergens { font-size: 10px; color: var(--danger); background: rgba(220, 53, 69, 0.08); padding: 4px 6px; border-radius: 6px; margin-bottom: 10px; border: 1px solid rgba(220, 53, 69, 0.2); }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-size: 16px; font-weight: 800; color: var(--text-main); }
        .add-btn { background: var(--accent-grad); color: #fff; border: none; padding: 8px 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        
        .cart-bar { position: fixed; bottom: 20px; left: 16px; right: 16px; background: var(--accent-grad); color: #fff; padding: 14px 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; cursor: pointer; z-index: 200; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4); }
        .cart-bar.hidden { display: none; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 300; display: none; justify-content: flex-end; flex-direction: column; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border-top: 1px solid var(--border); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; max-height: 80vh; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .cnt-btn { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); width: 28px; height: 28px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .checkout-btn { width: 100%; background: var(--accent-grad); color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 800; font-size: 16px; margin-top: 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3); }
    </style>
</head>
<body>
    <header>
        <div class="logo">ROYAL CHOICE</div>
        <div class="sub-location">Приднипровск</div>
    </header>
    
    <div class="category-nav">
        <button class="category-btn active" onclick="filterCategory('sets', this)">🍱 Сеты</button>
        <button class="category-btn" onclick="filterCategory('pizza', this)">🍕 Пицца</button>
        <button class="category-btn" onclick="filterCategory('drinks', this)">🥤 Напитки</button>
    </div>
    
    <div class="container">
        <div class="grid" id="menu-grid"></div>
    </div>
    
    <div class="cart-bar hidden" id="cart-bar" onclick="openCart()">
        <span id="cart-count">0 товаров</span>
        <span>Оформить • <span id="cart-total">0 ₴</span></span>
    </div>
    
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px; align-items:center;">
                <h2 style="font-size: 18px;">Ваш заказ</h2>
                <button onclick="closeCart()" style="background:none; border:none; color:var(--text-muted); font-size:22px; cursor:pointer;">✕</button>
            </div>
            <div id="cart-items"></div>
            <div style="margin-top:20px; display:flex; justify-content:space-between; font-weight:bold; font-size:18px;">
                <span>Итого:</span>
                <span id="modal-total" style="color:#b38f27;">0 ₴</span>
            </div>
            <button class="checkout-btn" onclick="sendOrder()">Отправить заказ в ресторан</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const menu = [
            // Сеты
            { id: 101, category: "sets", name: "Сет Royal Premium", desc: "Филадельфия с лососем, Калифорния, Дракон с угрём, Запеченный ролл", weight: "1150 г", allergens: "Морепродукты, кунжут, соя", price: 980, img: "https://images.unsplash.com/photo-1617196034796-73dfa7b1fd56?auto=format&fit=crop&w=500&q=80" },
            { id: 102, category: "sets", name: "Сет Филадельфия MIX", desc: "Филадельфия классик, Филадельфия с угрём, Филадельфия с тунцом", weight: "890 г", allergens: "Рыба, лактоза, кунжут", price: 850, img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=500&q=80" },
            { id: 103, category: "sets", name: "Сет Горячая Дюжина", desc: "Запеченный с лососем, Запеченный с креветкой, Темпура с крабом", weight: "950 г", allergens: "Морепродукты, яйцо, глютен", price: 790, img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?auto=format&fit=crop&w=500&q=80" },
            
            // Пицца
            { id: 201, category: "pizza", name: "Пицца Бешамель с Курицей", desc: "Фирменный соус бешамель, сочная куриная ветчина, охотничьи колбаски, моцарелла", weight: "580 г", allergens: "Глютен, лактоза", price: 340, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=500&q=80" },
            { id: 202, category: "pizza", name: "Пицца BBQ с Дымком", desc: "Копченое филе, охотничьи колбаски, соус барбекю, лук фри, сыр моцарелла", weight: "610 г", allergens: "Глютен, горчица", price: 360, img: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=500&q=80" },
            { id: 203, category: "pizza", name: "Пицца Четыре Сыра Royal", desc: "Моцарелла, дор блю, пармезан, чеддер, ореховый соус", weight: "520 г", allergens: "Лактоза, орехи, глютен", price: 390, img: "https://images.unsplash.com/photo-1573821663912-569905455b1c?auto=format&fit=crop&w=500&q=80" },

            // Напитки
            { id: 301, category: "drinks", name: "Coca-Cola Original", desc: "Освежающий газированный напиток", weight: "0.5 л", allergens: "", price: 55, img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=500&q=80" },
            { id: 302, category: "drinks", name: "Сок Rich Яблочный", desc: "100% натуральный яблочный сок прямого отжима", weight: "1.0 л", allergens: "", price: 95, img: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=500&q=80" }
        ];

        let currentCategory = 'sets';
        let cart = {};

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            renderMenu();
        }

        function renderMenu() {
            const items = menu.filter(m => m.category === currentCategory);
            document.getElementById('menu-grid').innerHTML = items.map(item => `
                <div class="card">
                    <div class="card-img-wrap">
                        <span class="weight-badge">${item.weight}</span>
                        <img src="${item.img}" class="card-img" alt="${item.name}">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${item.name}</div>
                        <div class="card-desc">${item.desc}</div>
                        ${item.allergens ? `<div class="allergens">⚠️ ${item.allergens}</div>` : ''}
                        <div class="card-footer">
                            <div class="price">${item.price} ₴</div>
                            <button class="add-btn" onclick="addToCart(${item.id})">+ Добавить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) { cart[id] = (cart[id] || 0) + 1; updateCart(); }
        function changeQty(id, delta) { if (cart[id]) { cart[id] += delta; if (cart[id] <= 0) delete cart[id]; } updateCart(); }

        function updateCart() {
            let total = 0, count = 0;
            for (let id in cart) { 
                const item = menu.find(m => m.id == id); 
                total += item.price * cart[id]; 
                count += cart[id]; 
            }
            const cartBar = document.getElementById('cart-bar');
            if (count > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('cart-count').innerText = `${count} позиций`;
                document.getElementById('cart-total').innerText = `${total} ₴`;
            } else { 
                cartBar.classList.add('hidden'); 
                closeCart(); 
            }
            document.getElementById('modal-total').innerText = `${total} ₴`;
            renderCartItems();
        }

        function renderCartItems() {
            let html = '';
            for (let id in cart) {
                const item = menu.find(m => m.id == id);
                html += `<div class="cart-item">
                    <div>
                        <div style="font-weight:bold;">${item.name}</div>
                        <div style="font-size:12px; color:var(--text-muted);">${item.price * cart[id]} ₴ (${item.weight})</div>
                    </div>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button class="cnt-btn" onclick="changeQty(${id}, -1)">-</button>
                        <span>${cart[id]}</span>
                        <button class="cnt-btn" onclick="changeQty(${id}, 1)">+</button>
                    </div>
                </div>`;
            }
            document.getElementById('cart-items').innerHTML = html || 'Корзина пуста';
        }

        function openCart() { document.getElementById('cart-modal').classList.add('active'); }
        function closeCart() { document.getElementById('cart-modal').classList.remove('active'); }

        function sendOrder() {
            let orderSummary = []; let total = 0;
            for (let id in cart) { 
                const item = menu.find(m => m.id == id); 
                orderSummary.push(`${item.name} (${item.weight}) x${cart[id]}`); 
                total += item.price * cart[id]; 
            }
            tg.sendData(JSON.stringify({ items: orderSummary, total: total }));
        }

        renderMenu();
    </script>
</body>
</html>
