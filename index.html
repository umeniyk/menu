<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Royal Choice | Меню</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg: #0d0f12; 
            --card-bg: #161920; 
            --accent: #f39c12; 
            --accent-glow: rgba(243, 156, 18, 0.25);
            --text-main: #ffffff; 
            --text-sub: #9ea7b4; 
            --border: #232833; 
            --danger: #ff5252;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); padding-bottom: 100px; }
        
        /* Хедер */
        header { background: rgba(22, 25, 32, 0.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo-title { font-size: 18px; font-weight: 900; letter-spacing: 1.5px; background: linear-gradient(45deg, #f39c12, #f1c40f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub-title { font-size: 11px; color: var(--text-sub); }

        /* Категории */
        .category-nav { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: var(--bg); position: sticky; top: 57px; z-index: 90; scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid var(--border); padding: 10px 18px; border-radius: 25px; font-size: 13px; font-weight: 700; white-space: nowrap; transition: all 0.2s; cursor: pointer; }
        .cat-btn.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

        /* Сетка блюд */
        .container { padding: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card-img-wrap { position: relative; width: 100%; height: 130px; background: #202530; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .weight-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0, 0, 0, 0.8); color: var(--accent); font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 8px; border: 1px solid rgba(243, 156, 18, 0.4); backdrop-filter: blur(4px); }
        
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; line-height: 1.2; }
        .card-desc { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; flex-grow: 1; line-height: 1.3; }
        .allergen-tag { font-size: 10px; color: var(--danger); background: rgba(255, 82, 82, 0.1); padding: 4px 6px; border-radius: 6px; margin-bottom: 10px; border: 1px solid rgba(255, 82, 82, 0.2); }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-size: 16px; font-weight: 900; color: #fff; }
        .add-btn { background: var(--accent); color: #000; border: none; padding: 8px 12px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; transition: transform 0.1s; }
        .add-btn:active { transform: scale(0.95); }

        /* Плавающая корзина */
        .cart-bar { position: fixed; bottom: 20px; left: 16px; right: 16px; background: var(--accent); color: #000; padding: 16px 20px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 15px; cursor: pointer; z-index: 200; box-shadow: 0 8px 25px var(--accent-glow); }
        .cart-bar.hidden { display: none; }

        /* Модальное окно корзины */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 300; display: none; justify-content: flex-end; flex-direction: column; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border-top: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .cnt-btn { background: var(--border); color: #fff; border: none; width: 30px; height: 30px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .checkout-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 16px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="logo-title">ROYAL CHOICE</div>
            <div class="sub-title">Приднипровск</div>
        </div>
    </header>

    <div class="category-nav">
        <button class="cat-btn active" onclick="filterCat('sets', this)">🍱 Все Сеты</button>
        <button class="cat-btn" onclick="filterCat('pizza_news', this)">🍕 Новинки Пицц</button>
        <button class="cat-btn" onclick="filterCat('drinks', this)">🥤 Напитки</button>
    </div>

    <div class="container">
        <div class="grid" id="menu-grid"></div>
    </div>

    <div class="cart-bar hidden" id="cart-bar" onclick="openCart()">
        <span id="cart-count">0 позиций</span>
        <span>Оформить • <span id="cart-total">0 ₴</span></span>
    </div>

    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ваш заказ</h3>
                <button onclick="closeCart()" style="background:none; border:none; color:var(--text-sub); font-size:22px; cursor:pointer;">✕</button>
            </div>
            <div id="cart-items"></div>
            <div style="margin-top:20px; display:flex; justify-content:space-between; font-weight:900; font-size:18px;">
                <span>К оплате:</span>
                <span id="modal-total" style="color:var(--accent);">0 ₴</span>
            </div>
            <button class="checkout-btn" onclick="sendOrder()">Подтвердить и отправить</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const menu = [
            // Сеты
            { id: 101, category: "sets", name: "Сет Royal Deluxe", desc: "Филадельфия с лососем, Калифорния в кунжуте, Дракон с угрём, Запеченный ролл", weight: "1250 г", allergens: "Морепродукты, кунжут, соя", price: 990, img: "https://images.unsplash.com/photo-1617196034796-73dfa7b1fd56?auto=format&fit=crop&w=600&q=80" },
            { id: 102, category: "sets", name: "Сет Филадельфия MIX", desc: "Филадельфия Классик, Филадельфия в кунжуте, Филадельфия с угрём", weight: "920 г", allergens: "Рыба, лактоза, кунжут", price: 870, img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=600&q=80" },
            { id: 103, category: "sets", name: "Сет Горячий Дракон", desc: "Запеченный с лососем, Темпура с креветкой, Запеченный с тунцом", weight: "980 г", allergens: "Морепродукты, яйцо, глютен", price: 820, img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?auto=format&fit=crop&w=600&q=80" },

            // Новинки Пицц
            { id: 201, category: "pizza_news", name: "Пицца Бешамель с Курицей", desc: "Фирменный соус бешамель, сочная куриная ветчина, охотничьи колбаски, сыр моцарелла", weight: "580 г", allergens: "Глютен, лактоза", price: 340, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=600&q=80" },
            { id: 202, category: "pizza_news", name: "Пицца BBQ с Дымком", desc: "Копченая курица, охотничьи колбаски, соус барбекю, хрустящий лук фри, моцарелла", weight: "610 г", allergens: "Глютен, горчица", price: 360, img: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=600&q=80" },
            { id: 203, category: "pizza_news", name: "Пицца Четыре Сыра Royal", desc: "Моцарелла, дор блю, пармезан, чеддер, фирменный соус", weight: "520 г", allergens: "Лактоза, глютен", price: 390, img: "https://images.unsplash.com/photo-1573821663912-569905455b1c?auto=format&fit=crop&w=600&q=80" },

            // Напитки
            { id: 301, category: "drinks", name: "Coca-Cola Original", desc: "Классический газированный напиток", weight: "0.5 л", allergens: "", price: 55, img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=600&q=80" },
            { id: 302, category: "drinks", name: "Сок Rich Яблочный", desc: "100% натуральный яблочный сок", weight: "1.0 л", allergens: "", price: 95, img: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=600&q=80" },
            { id: 303, category: "drinks", name: "Sprite", desc: "Освежающий лимонно-лаймовый напиток", weight: "0.5 л", allergens: "", price: 55, img: "https://images.unsplash.com/photo-1625772299848-391b6a87d7b3?auto=format&fit=crop&w=600&q=80" }
        ];

        let currentCat = 'sets';
        let cart = {};

        function filterCat(cat, el) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function render() {
            const items = menu.filter(x => x.category === currentCat);
            document.getElementById('menu-grid').innerHTML = items.map(item => `
                <div class="card">
                    <div class="card-img-wrap">
                        <img src="${item.img}" class="card-img" alt="${item.name}">
                        <span class="weight-badge">${item.weight}</span>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${item.name}</div>
                        <div class="card-desc">${item.desc}</div>
                        ${item.allergens ? `<div class="allergen-tag">⚠️ ${item.allergens}</div>` : ''}
                        <div class="card-footer">
                            <div class="price">${item.price} ₴</div>
                            <button class="add-btn" onclick="addToCart(${item.id})">+ Добавить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) { cart[id] = (cart[id] || 0) + 1; updateCart(); }
        function changeQty(id, delta) { if (cart[id]) { cart[id] += delta; if (cart[id] <= 0) delete cart[id]; } updateCart(); }

        function updateCart() {
            let total = 0, count = 0;
            for (let id in cart) { 
                const item = menu.find(m => m.id == id); 
                total += item.price * cart[id]; 
                count += cart[id]; 
            }
            const cartBar = document.getElementById('cart-bar');
            if (count > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('cart-count').innerText = `${count} шт.`;
                document.getElementById('cart-total').innerText = `${total} ₴`;
            } else { 
                cartBar.classList.add('hidden'); 
                closeCart(); 
            }
            document.getElementById('modal-total').innerText = `${total} ₴`;
            renderCart();
        }

        function renderCart() {
            let html = '';
            for (let id in cart) {
                const item = menu.find(m => m.id == id);
                html += `<div class="cart-item">
                    <div>
                        <div style="font-weight:bold; font-size:14px;">${item.name}</div>
                        <div style="font-size:12px; color:var(--text-sub);">${item.price * cart[id]} ₴ • ${item.weight}</div>
                    </div>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <button class="cnt-btn" onclick="changeQty(${id}, -1)">-</button>
                        <span style="font-weight:bold;">${cart[id]}</span>
                        <button class="cnt-btn" onclick="changeQty(${id}, 1)">+</button>
                    </div>
                </div>`;
            }
            document.getElementById('cart-items').innerHTML = html || 'Корзина пуста';
        }

        function openCart() { document.getElementById('cart-modal').classList.add('active'); }
        function closeCart() { document.getElementById('cart-modal').classList.remove('active'); }

        function sendOrder() {
            let orderSummary = []; let total = 0;
            for (let id in cart) { 
                const item = menu.find(m => m.id == id); 
                orderSummary.push(`${item.name} (${item.weight}) x${cart[id]}`); 
                total += item.price * cart[id]; 
            }
            tg.sendData(JSON.stringify({ items: orderSummary, total: total }));
        }

        render();
    </script>
</body>
</html>
